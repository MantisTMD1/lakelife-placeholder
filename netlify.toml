# Static site: no build step, publish the repo root.
# The command overrides any build command saved in the Netlify dashboard.
[build]
  command = "echo 'Static site, no build step'"
  publish = "."

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Font files never change in place; a new version gets a new name
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
